name: Build & Publish CloudStream Plugins

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 0

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Initialize Builds Directory if Missing
        run: |
          if [ ! -d "builds" ]; then
            mkdir -p builds
            cd builds
            git init
            git checkout -b builds
            cd ..
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Plugins
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          
          # Copy compiled .cs3 plugins and plugins.json to builds
          mkdir -p ../builds
          cp -f **/build/*.cs3 ../builds/ 2>/dev/null || true
          cp -f build/plugins.json ../builds/ 2>/dev/null || true
          
          # Generate repo.json manifest for CloudStream
          cat <<EOF > ../builds/repo.json
          {
            "name": "CloudStream TR Eklentileri",
            "description": "Dizipal, Yabancı Dizi ve HdFilmCehennemi reklamsız sağlayıcıları",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json"
            ]
          }
          EOF

      - name: Publish to Builds Branch
        run: |
          cd builds
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -B builds
          git add -A
          git commit -m "Auto-build plugins for commit ${{ github.sha }}" || exit 0
          git push -f origin HEAD:builds
